name: checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -c requirements/desktop-tested.txt -e ".[desktop,dev]"
      - run: python -m unittest discover -s tests -v
      - run: ruff check chengchuan tests/test_chengchuan.py tests/test_desktop.py tests/test_market.py tests/test_market_desktop.py tests/test_forecast.py tests/test_forecast_desktop.py tests/test_meoz.py tests/test_meoz_desktop.py scripts
      - run: ruff format --check chengchuan tests/test_chengchuan.py tests/test_desktop.py tests/test_market.py tests/test_market_desktop.py tests/test_forecast.py tests/test_forecast_desktop.py tests/test_meoz.py tests/test_meoz_desktop.py scripts
