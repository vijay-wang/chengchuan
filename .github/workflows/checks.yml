name: checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -c requirements/desktop-tested.txt -e ".[desktop,dev]"
      - run: python -m unittest discover -s tests -v
      - run: ruff check chengchuan tests/test_chengchuan.py tests/test_desktop.py tests/test_market.py tests/test_market_desktop.py tests/test_market_sources.py tests/test_forecast.py tests/test_forecast_desktop.py tests/test_nextday_features.py tests/test_nextday_model.py tests/test_nextday_service.py tests/test_nextday_inputs.py tests/test_nextday_metrics.py tests/test_nextday_reports.py tests/test_nextday_desktop.py tests/test_meoz.py tests/test_meoz_desktop.py tests/test_chart_tools.py tests/test_chart_navigation_desktop.py tests/test_chart_history_desktop.py tests/test_navigation_cache.py tests/test_navigation_performance_desktop.py tests/test_settings.py tests/test_settings_desktop.py tests/test_index_dashboard.py tests/test_meoz_dashboard.py tests/test_market_dashboard_desktop.py tests/test_market_refresh.py tests/test_market_views.py tests/test_market_views_desktop.py tests/test_microstructure.py tests/test_microstructure_desktop.py tests/test_sectors.py tests/test_research.py tests/test_research_desktop.py tests/test_company.py tests/test_company_desktop.py scripts
      - run: ruff format --check chengchuan tests/test_chengchuan.py tests/test_desktop.py tests/test_market.py tests/test_market_desktop.py tests/test_market_sources.py tests/test_forecast.py tests/test_forecast_desktop.py tests/test_nextday_features.py tests/test_nextday_model.py tests/test_nextday_service.py tests/test_nextday_inputs.py tests/test_nextday_metrics.py tests/test_nextday_reports.py tests/test_nextday_desktop.py tests/test_meoz.py tests/test_meoz_desktop.py tests/test_chart_tools.py tests/test_chart_navigation_desktop.py tests/test_chart_history_desktop.py tests/test_navigation_cache.py tests/test_navigation_performance_desktop.py tests/test_settings.py tests/test_settings_desktop.py tests/test_index_dashboard.py tests/test_meoz_dashboard.py tests/test_market_dashboard_desktop.py tests/test_market_refresh.py tests/test_market_views.py tests/test_market_views_desktop.py tests/test_microstructure.py tests/test_microstructure_desktop.py tests/test_sectors.py tests/test_research.py tests/test_research_desktop.py tests/test_company.py tests/test_company_desktop.py scripts
